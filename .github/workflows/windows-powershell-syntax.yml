name: Windows PowerShell syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse scripts with Windows PowerShell
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem .\scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.Name):" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
            else {
              Write-Host "OK: $($_.Name)"
            }
          }

          if ($failed) {
            exit 1
          }
